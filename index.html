<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>جاري التحميل...</title>
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#fff;
  overflow:hidden;
}
/* شاشة التحميل الحقيقية - نفس اللي تظهر لما ينقطع النت */
#loading-screen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#fff;
  z-index:10000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
}
.chrome-logo{
  width: 48px;
  height: 48px;
  margin-bottom: 24px;
}
.spinner{
  width: 36px;
  height: 36px;
  border: 3px solid #e0e0e0;
  border-top-color: #4285F4;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 20px;
}
@keyframes spin{
  to { transform: rotate(360deg); }
}
.loading-text{
  font-size: 14px;
  color: #5f6368;
  margin-bottom: 8px;
}
.url-text{
  font-size: 12px;
  color: #9aa0a6;
  word-break: break-all;
  max-width: 90%;
  text-align: center;
}
.hint{
  position: absolute;
  bottom: 30px;
  font-size: 11px;
  color: #dadce0;
}
/* عناصر المقلب - مخفية في البداية */
#matrix{ display:none; position:fixed; inset:0; z-index:1; }
#timer{ display:none; position:fixed; top:18px; right:25px; font-size:52px; color:#ff2222; z-index:20; }
#status{ display:none; position:fixed; top:20px; left:20px; font-size:25px; color:#ff3333; z-index:20; }
#term{ display:none; width:76%; height:72%; background:rgba(0,0,0,.88); border:1px solid #00ff66; padding:16px; overflow:auto; position:fixed; bottom:20px; left:20px; z-index:10; color:#00ff66; font-family:Consolas; }
#progressBox{ display:none; width:76%; margin-top:12px; border:1px solid #00ff66; background:rgba(0,0,0,.85); padding:8px; position:fixed; bottom:10px; left:20px; z-index:10; }
.win{ position:fixed; background:#020202; border:1px solid #00ff66; padding:10px; font-size:13px; z-index:15; color:#00ff66; }
.winTitle{ color:#ffd400; border-bottom:1px solid #00ff66; margin-bottom:6px; }
.red{ color:#ff3333; }
.yellow{ color:#ffd400; }
#flash{ display:none; position:fixed; inset:0; background:rgba(255,0,0,.12); z-index:30; pointer-events:none; }
#black{ display:none; position:fixed; inset:0; background:#000; z-index:9999; }
</style>
</head>
<body>

<!-- شاشة تحميل حقيقية جداً -->
<div id="loading-screen">
  <div class="spinner"></div>
  <div class="loading-text">جاري التحميل...</div>
  <div class="url-text">secure.google.com/verify</div>
  <div class="hint">انتظر جاري التوجيه...</div>
</div>

<canvas id="matrix"></canvas>
<div id="timer">60</div>
<div id="status">SECURE CONNECTION ACTIVE</div>
<div id="term"></div>
<div id="progressBox">
  <div id="progressLabel">VERIFICATION: <span id="progressText">1%</span></div>
  <div id="progressOuter"><div id="progressInner"></div></div>
</div>
<div id="flash"></div>
<div id="black"></div>

<script>
const loadingScreen = document.getElementById('loading-screen');

loadingScreen.addEventListener('click', function() {
    // Fullscreen
    const elem = document.documentElement;
    if (elem.requestFullscreen) elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    
    loadingScreen.style.display = 'none';
    document.getElementById('matrix').style.display = 'block';
    document.getElementById('timer').style.display = 'block';
    document.getElementById('status').style.display = 'block';
    document.getElementById('term').style.display = 'block';
    document.getElementById('progressBox').style.display = 'block';
    
    startEverything();
});

function startEverything() {
    initMatrix();
    startTerminal();
    startPopups();
    startProgress();
    startFlashes();
    startTimer();
}

let matrixInterval;
function initMatrix() {
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@%&";
    const font = 15;
    const cols = Math.floor(canvas.width / font);
    const drops = Array(cols).fill(1);
    matrixInterval = setInterval(() => {
        ctx.fillStyle = "rgba(0,0,0,.075)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00ff66";
        ctx.font = font + "px Consolas";
        for(let i=0;i<drops.length;i++){
            const txt = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(txt, i * font, drops[i] * font);
            if(drops[i] * font > canvas.height && Math.random() > .975) drops[i] = 0;
            drops[i]++;
        }
    }, 28);
}

let terminalInterval;
function startTerminal() {
    const term = document.getElementById("term");
    const lines = ["[SYSTEM] Secure handshake established","[USB] Device authenticated","[SCAN] Verifying credentials","[PROGRESS] Processing..."];
    function addLine(){
        const txt = lines[Math.floor(Math.random() * lines.length)];
        const d = document.createElement("div");
        d.textContent = "> " + txt;
        d.className = "green";
        term.appendChild(d);
        term.scrollTop = term.scrollHeight;
        if(term.children.length > 40) term.removeChild(term.children[0]);
    }
    terminalInterval = setInterval(addLine, 48);
}

let popupInterval;
function startPopups() {
    function spawn(){
        const w = document.createElement("div");
        w.className = "win";
        w.style.left = Math.random() * (innerWidth - 410) + "px";
        w.style.top = Math.random() * (innerHeight - 190) + "px";
        w.innerHTML = `<div class="winTitle">SECURE VERIFICATION</div>Token: ${Math.random().toString(36).substring(2,10)}<br><span class="red">ACTIVE</span>`;
        document.body.appendChild(w);
        setTimeout(() => w.remove(), 400);
    }
    popupInterval = setInterval(spawn, 105);
}

let progressInterval;
function startProgress() {
    let progress = 1;
    const inner = document.getElementById("progressInner");
    const text = document.getElementById("progressText");
    if(!inner) return;
    progressInterval = setInterval(() => {
        progress += Math.floor(Math.random() * 3) + 1;
        if(progress > 100) progress = 100;
        inner.style.width = progress + "%";
        text.textContent = progress + "%";
        if(progress >= 100) clearInterval(progressInterval);
    }, 650);
}

let flashInterval;
function startFlashes() {
    const flash = document.getElementById("flash");
    function redFlash(){
        flash.style.display = "block";
        setTimeout(() => flash.style.display = "none", 80);
    }
    flashInterval = setInterval(() => { if(Math.random() > .55) redFlash(); }, 900);
}

let countdown;
function startTimer() {
    let val = 60;
    const timer = document.getElementById("timer");
    countdown = setInterval(() => {
        val--;
        timer.textContent = val;
        if(val <= 0){
            clearInterval(countdown);
            document.getElementById("black").style.display = "block";
        }
    }, 1000);
}

window.addEventListener('resize', () => {
    const c = document.getElementById("matrix");
    if(c){ c.width = innerWidth; c.height = innerHeight; }
});
</script>
</body>
</html>
