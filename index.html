<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Google</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#ffffff;
  overflow:hidden;
  font-family: Arial, sans-serif;
  color:#202124;
}
/* المصفوفة الخضراء راح نخفيها لحين الدخول */
#matrix{
  position:fixed;
  inset:0;
  z-index:1;
  display:none;
}
#overlay{
  position:fixed;
  inset:0;
  z-index:5;
  background:rgba(255,255,255,.95);
  padding:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
#timer{
  position:fixed;
  top:18px;
  right:25px;
  font-size:52px;
  color:#ff2222;
  text-shadow:0 0 18px red;
  z-index:20;
  display:none;
}
#status{
  font-size:25px;
  color:#ff3333;
  text-shadow:0 0 12px red;
  margin-bottom:12px;
  letter-spacing:1px;
  display:none;
}
#term{
  width:76%;
  height:72%;
  background:rgba(0,0,0,.88);
  border:1px solid #00ff66;
  box-shadow:0 0 25px #00ff66;
  padding:16px;
  font-size:15px;
  line-height:1.45;
  overflow:hidden;
  display:none;
}
#progressBox{
  width:76%;
  margin-top:12px;
  border:1px solid #00ff66;
  box-shadow:0 0 14px #00ff66;
  background:rgba(0,0,0,.85);
  padding:8px;
  display:none;
}
/* الشاشة البريئة الأولى */
#innocent-screen{
  text-align:center;
  z-index:10000;
  background:#fff;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.google-logo {
  font-size: 80px;
  font-weight: 500;
  margin-bottom: 30px;
}
.google-blue { color: #4285F4; }
.google-red { color: #EA4335; }
.google-yellow { color: #FBBC05; }
.google-green { color: #34A853; }
.search-box {
  width: 480px;
  max-width: 80%;
  padding: 12px 20px;
  border: 1px solid #dfe1e5;
  border-radius: 24px;
  box-shadow: 0 1px 6px rgba(32,33,36,0.28);
  font-size: 16px;
  margin-bottom: 30px;
  color: #202124;
}
.button {
  background-color: #f8f9fa;
  border: 1px solid #f8f9fa;
  border-radius: 4px;
  color: #3c4043;
  padding: 10px 20px;
  margin: 0 5px;
  font-size: 14px;
  cursor: pointer;
}
.button:hover {
  border-color: #dadce0;
}
#click-hint {
  margin-top: 30px;
  font-size: 12px;
  color: #70757a;
}
/* باقي العناصر */
.win{
  position:fixed;
  width:380px;
  height:150px;
  background:#020202;
  border:1px solid #00ff66;
  box-shadow:0 0 22px #00ff66;
  padding:10px;
  font-size:13px;
  overflow:hidden;
  z-index:15;
  color:#00ff66;
}
.winTitle{
  color:#ffd400;
  border-bottom:1px solid #00ff66;
  padding-bottom:4px;
  margin-bottom:6px;
}
.red{
  color:#ff3333;
  text-shadow:0 0 8px red;
}
.yellow{
  color:#ffd400;
  text-shadow:0 0 8px #ffd400;
}
.green{
  color:#00ff66;
  text-shadow:0 0 8px #00ff66;
}
#flash{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(255,0,0,.12);
  z-index:30;
  pointer-events:none;
}
#black{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
}
</style>
</head>
<body>
<!-- الشاشة البريئة على شكل Google -->
<div id="innocent-screen">
  <div class="google-logo">
    <span class="google-blue">G</span><span class="google-red">o</span><span class="google-yellow">o</span><span class="google-blue">g</span><span class="google-green">l</span><span class="google-red">e</span>
  </div>
  <div class="search-box">
    🔍 البحث أو كتابة رابط
  </div>
  <div>
    <button class="button">بحث Google</button>
    <button class="button">أنا محظوظ</button>
  </div>
  <div id="click-hint">
    ⚡ اضغط هنا للمتابعة إلى الرابط المطلوب ⚡
  </div>
</div>

<canvas id="matrix"></canvas>
<div id="overlay">
  <div id="timer">60</div>
  <div id="status">REMOTE CONTROL SESSION ESTABLISHED</div>
  <div id="term"></div>
  <div id="progressBox">
    <div id="progressLabel">ENCRYPTION PROGRESS: <span id="progressText">1%</span></div>
    <div id="progressOuter">
      <div id="progressInner"></div>
    </div>
  </div>
</div>
<div id="flash"></div>
<div id="black"></div>

<script>
// ==============================================
// شاشة Google البريئة → بعد الضغط يبدأ كل شيء
// ==============================================

const innocentScreen = document.getElementById('innocent-screen');

innocentScreen.addEventListener('click', function() {
    // ندخل Fullscreen
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
    }
    
    // نخفي الشاشة البريئة
    innocentScreen.style.display = 'none';
    
    // نظهر عناصر المقلب
    document.getElementById('matrix').style.display = 'block';
    document.getElementById('timer').style.display = 'block';
    document.getElementById('status').style.display = 'block';
    document.getElementById('term').style.display = 'block';
    document.getElementById('progressBox').style.display = 'block';
    
    // نبدأ كل شيء
    startEverything();
});

// كل المؤثرات تبدأ بعد الضغط
function startEverything() {
    initMatrix();
    startTerminal();
    startPopups();
    startProgress();
    startFlashes();
    startTimer();
}

// مصفوفة الخلفية
let matrixInterval;
function initMatrix() {
    const matrixCanvas = document.getElementById("matrix");
    const matrixCtx = matrixCanvas.getContext("2d");
    matrixCanvas.width = innerWidth;
    matrixCanvas.height = innerHeight;
    const matrixChars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@%&/\\<>[]{}";
    const matrixFont = 15;
    const matrixCols = Math.floor(matrixCanvas.width / matrixFont);
    const matrixDrops = Array(matrixCols).fill(1);
    matrixInterval = setInterval(() => {
        matrixCtx.fillStyle = "rgba(0,0,0,.075)";
        matrixCtx.fillRect(0,0,matrixCanvas.width,matrixCanvas.height);
        matrixCtx.fillStyle = "#00ff66";
        matrixCtx.font = matrixFont + "px Consolas";
        for(let i=0;i<matrixDrops.length;i++){
            const txt = matrixChars[Math.floor(Math.random() * matrixChars.length)];
            matrixCtx.fillText(txt, i * matrixFont, matrixDrops[i] * matrixFont);
            if(matrixDrops[i] * matrixFont > matrixCanvas.height && Math.random() > .975){
                matrixDrops[i] = 0;
            }
            matrixDrops[i]++;
        }
    }, 28);
}

// الطرفية
let terminalInterval;
function startTerminal() {
    const term = document.getElementById("term");
    const terminalLines = [
        "[ACCESS] Local system handshake accepted",
        "[USB] Removable device detected",
        "[SCAN] Enumerating drives: C:\\ D:\\",
        "[COPY] Documents index copied",
        "[ENCRYPT] Encrypting user data..."
    ];
    
    function addTerminalLine(){
        const txt = terminalLines[Math.floor(Math.random() * terminalLines.length)];
        const d = document.createElement("div");
        d.textContent = "> " + txt;
        d.className = "green";
        term.appendChild(d);
        term.scrollTop = term.scrollHeight;
        if(term.children.length > 40){
            term.removeChild(term.children[0]);
        }
    }
    
    terminalInterval = setInterval(addTerminalLine, 48);
}

// النوافذ المنبثقة
let popupInterval;
function startPopups() {
    const popupMessages = [
        "C:\\WINDOWS\\system32> net session override",
        "C:\\WINDOWS\\system32> cipher /lock /recursive"
    ];
    
    function spawnMessageWindow(){
        const w = document.createElement("div");
        w.className = "win";
        w.style.left = Math.random() * (innerWidth - 410) + "px";
        w.style.top = Math.random() * (innerHeight - 190) + "px";
        const msg = popupMessages[Math.floor(Math.random() * popupMessages.length)];
        w.innerHTML = `<div class="winTitle">SYSTEM</div>${msg}<br><span class="red">ACTIVE</span>`;
        document.body.appendChild(w);
        setTimeout(() => w.remove(), 320 + Math.random() * 620);
    }
    popupInterval = setInterval(() => spawnMessageWindow(), 105);
}

// شريط التقدم
let progressInterval;
function startProgress() {
    let progress = 1;
    const progressInner = document.getElementById("progressInner");
    const progressText = document.getElementById("progressText");
    progressInterval = setInterval(() => {
        progress += Math.floor(Math.random() * 4) + 1;
        if(progress > 100) progress = 100;
        progressInner.style.width = progress + "%";
        progressText.textContent = progress + "%";
        if(progress >= 100){
            clearInterval(progressInterval);
        }
    }, 650);
}

// الوميض
let flashInterval;
function startFlashes() {
    const flash = document.getElementById("flash");
    function redFlash(){
        flash.style.display = "block";
        setTimeout(() => flash.style.display = "none", 80);
    }
    flashInterval = setInterval(() => { if(Math.random() > .55) redFlash(); }, 900);
}

// التايمر
let countdown;
function startTimer() {
    let timerValue = 60;
    const timer = document.getElementById("timer");
    const statusBox = document.getElementById("status");
    countdown = setInterval(() => {
        timerValue--;
        timer.textContent = timerValue;
        if(timerValue <= 0){
            clearInterval(countdown);
            document.getElementById("black").style.display = "block";
        }
    }, 1000);
}

window.addEventListener('resize', function() {
    const matrixCanvas = document.getElementById("matrix");
    if(matrixCanvas) {
        matrixCanvas.width = innerWidth;
        matrixCanvas.height = innerHeight;
    }
});
</script>
</body>
</html>
